<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Russell Cole social card</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; background: #F8F5F0; color: #1A1A1A; font-family: Georgia, serif; }
main { display: flex; align-items: center; height: 100%; padding: 65px 72px; gap: 55px; }
.copy { width: 650px; border-left: 4px solid #2E6F4E; padding-left: 28px; }
.eyebrow { font: 18px Arial, sans-serif; letter-spacing: 2px; color: #2E6F4E; margin: 0 0 22px; }
h1 { font-size: 82px; font-weight: 500; letter-spacing: -2px; margin: 0 0 20px; }
.lead { font-size: 33px; line-height: 1.3; margin: 0 0 18px; }
.detail { font: 23px/1.4 Arial, sans-serif; color: #64615B; margin: 0 0 32px; }
.url { font: 20px Arial, sans-serif; color: #2E6F4E; margin: 0; }
img { width: 340px; height: 340px; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid #D4CFC8; }
</style>
<main>
  <div class="copy">
    <p class="eyebrow">AI-NATIVE BUILDER &amp; FOUNDER-OPERATOR</p>
    <h1>Russell Cole</h1>
    <p class="lead">At the edge of what AI can do.<br>Building products that work.</p>
    <p class="detail">Product. Systems. Founder support.<br>Claude and Codex, with proof behind the work.</p>
    <p class="url">russellcolevop.github.io</p>
  </div>
  <img src="russell-headshot-zoom.jpg" alt="Russell Cole">
</main>
</html>
